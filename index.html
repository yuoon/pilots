<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYC Book Crawl — Walking Tour</title>
    <meta name="description" content="An interactive, shareable Google Maps walking tour of two NYC indie & used bookstore crawl routes in Lower Manhattan." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      body { font-family: 'Inter', system-ui, sans-serif; background: #FDF8F0; color: #1A1A1A; -webkit-font-smoothing: antialiased; }

      /* App layout */
      .main-layout {
        display: flex;
        flex: 1;
        overflow: hidden;
        flex-direction: row;
      }
      .map-pane {
        position: relative;
        flex: 0 0 58%;
      }
      .sidebar-pane {
        display: flex;
        flex-direction: column;
        flex: 0 0 42%;
        overflow: hidden;
        border-left: 1px solid #E9E0CC;
      }
      @media (max-width: 768px) {
        .main-layout { flex-direction: column; }
        .map-pane { flex: 0 0 320px; }
        .sidebar-pane { flex: 1; border-left: none; border-top: 1px solid #E9E0CC; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
